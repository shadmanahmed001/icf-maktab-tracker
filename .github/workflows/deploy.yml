# Builds, tests and publishes the maktab tracker.
#
# Three outputs, because "deploy it somewhere" has two different meanings:
#
#   demo   → a public, clickable page on GitHub Pages. Anyone with the link can
#            walk all three portals. No server, so nothing they type is saved.
#            Right for gathering feedback on the design and the workflow.
#
#   image  → a container image on GitHub Container Registry, so the real
#            application — with a working database — is one `docker run` away on
#            any machine. Right for a pilot where people enter real data.
#
#   tests  → gate both of the above; nothing publishes from a red build.

name: Deploy

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

# Never let two Pages deploys race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: API tests
        run: npm test

      - name: Lint the client
        run: |
          npm --prefix client ci
          npm run lint

  demo:
    name: Public demo (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix client ci

      # Records the real API's responses, then bundles them into one HTML file
      # so the demo shows exactly what the live application returns.
      - name: Capture fixtures from the real API
        run: npm run demo:fixtures

      - name: Build the single-file demo
        run: npm run demo:build

      # Pages serves from a subpath with no server-side routing, which is where
      # a single-page app usually breaks. Prove it works before publishing.
      - name: Verify subpath hosting
        run: |
          npx playwright install --with-deps chromium
          npm run demo:verify-pages

      - name: Assemble the Pages site
        run: |
          mkdir -p site
          cp client/dist-demo/index.demo.html site/index.html
          cp client/public/favicon.svg site/favicon.svg
          # Pages runs Jekyll unless told otherwise, which we do not want.
          touch site/.nojekyll
          ls -la site
          echo "Demo page size: $(du -h site/index.html | cut -f1)"

      # `enablement` turns Pages on for the repository if it is off, using the
      # workflow's own pages:write permission — so the first run needs no visit
      # to the repository settings.
      # Always keep the built page as a downloadable artifact, so the demo is
      # obtainable from a run even when Pages is not turned on.
      - name: Upload the page as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maktab-demo-page
          path: site/index.html
          if-no-files-found: error

      # Whether Pages is switched on is a repository setting that only an owner
      # can change — the workflow token is refused ("Resource not accessible by
      # integration"). So check first and say what to click, rather than failing
      # the run on every push with an error that looks like a build problem.
      - name: Is GitHub Pages switched on?
        id: pages_state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled; publishing."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Demo built, but GitHub Pages is not switched on"
              echo
              echo "The page is attached to this run as the **maktab-demo-page** artifact."
              echo "To publish it at a public URL, one repository owner needs to do this once:"
              echo
              echo "1. Open **Settings → Pages**"
              echo "2. Under **Build and deployment → Source**, choose **GitHub Actions**"
              echo "3. Re-run this workflow"
              echo
              echo "Every later push then publishes automatically."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Pages not enabled::Settings → Pages → Source: GitHub Actions, then re-run. The built page is attached as an artifact."
          fi

      - if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4

  image:
    name: Container image (GHCR)
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A tag per branch, plus `latest` on the default branch.
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
