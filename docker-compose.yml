services:
  maktab-tracker:
    build: .
    container_name: icf-maktab-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/maktab.db
      # Set this to a long random string before going live.
      - JWT_SECRET=${JWT_SECRET:-}
      # Turn off once real accounts exist.
      - DEMO_MODE=${DEMO_MODE:-true}
    volumes:
      - maktab_data:/app/data

volumes:
  maktab_data:
